[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[build.args]
# Set to the Railway backend service URL after the backend is deployed
# e.g. https://nexus-backend.up.railway.app/api/v1
NEXT_PUBLIC_API_URL = ""

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
