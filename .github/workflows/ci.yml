name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install ruff
        run: pip install ruff==0.8.6

      - name: Lint
        run: ruff check app/ tests/ --select E,F,W,I --ignore E501

  # ── Job 2: Backend Tests ─────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests + Coverage
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          GROQ_API_KEY: "dummy-not-needed-for-unit-tests"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
        run: |
          pytest tests/ -v --tb=short -x \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=40

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Verify app imports cleanly
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          GROQ_API_KEY: "dummy"
        run: python -c "from app.main import app; print('App imports OK')"

  # ── Job 3: Frontend Type Check ───────────────────────────────────────────────
  frontend-checks:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # ── Summary gate ─────────────────────────────────────────────────────────────
  # All three jobs must pass for the CI to be green.
  # Add this job as the required check in branch protection rules.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, backend-tests, frontend-checks]
    steps:
      - run: echo "All checks passed"

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # Runs ONLY on push to main (not on PRs) after all CI jobs pass.
  # Requires RAILWAY_TOKEN secret set in repo Settings → Secrets → Actions.
  #
  # Setup steps (one-time):
  #   1. Create project at railway.app
  #   2. railway login → railway link (inside backend/)
  #   3. Add Postgres + Redis plugins in Railway dashboard
  #   4. Set env vars from backend/.env.production.example
  #   5. Copy token from railway.app/account/tokens → GitHub secret RAILWAY_TOKEN
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [lint, backend-tests, frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend
        working-directory: backend
        run: railway up --service nexus-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true  # remove once RAILWAY_TOKEN secret is configured

      - name: Deploy frontend
        working-directory: frontend
        run: railway up --service nexus-frontend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true  # remove once RAILWAY_TOKEN secret is configured
